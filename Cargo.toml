[package]
name = "fwd"
description = "framework daemon, to turn the laptop's leds into a system monitor"
homepage = "https://github.com/Elec3137/fwd"
license = "AGPL-3.0-or-later"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = "1.1.1"
serialport = "4.9.0"
sysinfo = "0.40.4"
thiserror = "2.0.21"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
strip = "symbols"
